<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passphrase (BIP39) - Tutoriales</title>
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --accent: #f7931a; --accent-dim: #c4700f; --accent-glow: rgba(247,147,26,0.15);
    --text: #f0f0f0; --muted: #888; --sidebar-w: 270px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
    transition: transform .3s ease;
  }
  #sidebar-logo {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #sidebar-logo .logo-icon { font-size: 22px; }
  #sidebar-logo .logo-text { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .5px; line-height: 1.3; }
  #sidebar-logo .logo-sub { font-size: 13px; color: var(--muted); font-weight: 400; }

  .sec-group { border-bottom: 1px solid var(--border); }
  .sec-header {
    padding: 9px 16px; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    color: var(--text); transition: color .2s; letter-spacing: 0; text-transform: none;
  }
  .sec-header:hover { color: var(--text); }
  .sec-header.active { color: var(--accent); }
  .sec-header .arrow { font-size: 9px; transition: transform .2s; }
  .sec-header.open .arrow { transform: rotate(90deg); }
  .sec-items { display: none; }
  .sec-items.open { display: block; }

  .sec-item {
    padding: 7px 16px 7px 14px; font-size: 15px;
    cursor: pointer; color: var(--muted); transition: background .1s;
    border-left: 2px solid transparent; display: flex; align-items: baseline; gap: 5px;
  }
  .sec-item.ready { color: var(--text); }
  .sec-item:hover { background: #1e1208; color: var(--text); border-left-color: var(--accent-dim); }
  .sec-item.active { color: var(--accent); border-left-color: var(--accent); background: #1a0f00; }
  .sec-item .step-num { font-size: 12px; color: var(--accent); font-family: monospace; min-width: 20px; }

  /* Brand blocks (3rd level) */
  .brand-header {
    padding: 6px 16px 6px 24px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    color: #666; background: #111; border-top: 1px solid #222;
    transition: color .2s;
  }
  .brand-header:hover { color: var(--text); }
  .brand-header.active { color: var(--accent); }
  .brand-header .arrow { font-size: 9px; transition: transform .2s; }
  .brand-header.open .arrow { transform: rotate(90deg); }
  .brand-items { display: none; }
  .brand-items.open { display: block; }
  .brand-items .sec-item { padding-left: 32px; }

  /* HAMBURGER */
  #hamburger {
    display: none; background: none; border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px;
    cursor: pointer; font-size: 16px; line-height: 1;
    transition: all .2s; white-space: nowrap; flex-shrink: 0;
  }
  #hamburger:hover { border-color: var(--accent); color: var(--accent); }
  #sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 199;
  }
  #sidebar-overlay.open { display: block; }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* TOPBAR */
  #topbar {
    padding: 10px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; color: var(--accent); white-space: nowrap; font-weight: 700; }
  #search-wrap { flex: 1; min-width: 160px; position: relative; }
  #search-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--muted); }
  #search-results {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    z-index: 100; max-height: 260px; overflow-y: auto;
  }
  #search-results.open { display: block; }
  .sr-item {
    padding: 8px 12px; font-size: 12px; cursor: pointer;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline;
    border-bottom: 1px solid var(--border);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: #1a0f00; }
  .sr-num { color: var(--accent); font-family: monospace; font-size: 10px; min-width: 24px; flex-shrink: 0; }
  .sr-label { color: var(--text); flex-shrink: 0; }
  .sr-sec { color: var(--muted); font-size: 10px; }
  .sr-snippet { color: #555; font-size: 10px; font-style: italic; width: 100%; padding-left: 30px; }

  #lang-toggle {
    background: var(--border); border: none; color: var(--text);
    padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 12px;
    transition: background .2s; white-space: nowrap;
  }
  #lang-toggle:hover { background: var(--accent); color: #fff; }

  /* PROGRESS */
  #progress-bar { height: 3px; background: var(--border); }
  #progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 28px 32px; max-width: 860px; }

  h2.sec-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    margin-bottom: 6px; padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
  }
  h2.sec-title .brand-badge {
    display: inline-block; background: var(--accent); color: #000;
    font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px;
    vertical-align: middle; margin-left: 10px; letter-spacing: .5px;
  }
  h2.sec-title .brand-badge.brand-foundation {
    background: #1a0f00; color: var(--accent); border: 1px solid var(--accent-dim);
  }
  .sec-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; margin-top: 4px; }

  /* STEP CARD */
  .step-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 16px; overflow: hidden;
    transition: border-color .2s;
  }
  .step-card:hover { border-color: var(--accent-dim); }
  .step-card-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .step-badge {
    color: var(--accent); font-size: 13px; font-weight: 800;
    white-space: nowrap; flex-shrink: 0;
  }
  .step-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .step-body { padding: 14px 16px; display: flex; gap: 16px; align-items: flex-start; }
  .step-body.no-img { display: block; }
  .step-img-wrap { flex-shrink: 0; max-width: 100%; }
  .step-img-wrap img {
    border-radius: 6px; border: 1px solid var(--border);
    display: block; width: 100%; cursor: zoom-in;
    transition: border-color .2s;
  }
  .step-img-wrap img:hover { border-color: var(--accent); }
  .step-text { font-size: 13px; line-height: 1.65; color: #ccc; flex: 1; }
  .step-text strong { color: var(--text); }
  .step-text code {
    background: #111; border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: 12px;
    font-family: 'Cascadia Code','Consolas',monospace; color: var(--accent);
  }

  /* TIPS / WARNINGS */
  .tip {
    background: rgba(247,147,26,.08); border: 1px solid rgba(247,147,26,.3);
    border-left: 3px solid var(--accent); padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }
  .warn {
    background: rgba(220,50,50,.08); border: 1px solid rgba(220,50,50,.3);
    border-left: 3px solid #dc3232; padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }
  .info {
    background: rgba(100,180,255,.06); border: 1px solid rgba(100,180,255,.2);
    border-left: 3px solid #64b4ff; padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }

  /* INTRO / HERO */
  .hero {
    background: linear-gradient(135deg, #1a0f00 0%, #1a1a1a 100%);
    border: 1px solid var(--accent-dim); border-radius: 12px;
    padding: 28px 32px; margin-bottom: 24px;
  }
  .hero h1 { font-size: 26px; color: var(--accent); margin-bottom: 8px; }
  .hero p { font-size: 14px; color: #bbb; line-height: 1.7; }
  .hero .tagline { font-size: 13px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }

  /* CONCEPT CARDS */
  .concept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .concept-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .concept-card .icon { font-size: 24px; margin-bottom: 8px; }
  .concept-card h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .concept-card p { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* DEVICE INDEX TABLE */
  .device-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
  .device-table th { background: #111; color: var(--accent); text-align: left; padding: 8px 12px; border: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .device-table td { padding: 8px 12px; border: 1px solid var(--border); color: #ccc; }
  .device-table tr:hover td { background: #1a0f00; }
  .badge-hw { background: #1a0f00; color: var(--accent); border: 1px solid var(--accent-dim); padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-sw { background: #0f1a2a; color: #64b4ff; border: 1px solid #2a4a6a; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-mobile { background: #0f1a0f; color: #4caf50; border: 1px solid #2a4a2a; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .dot-yes { color: #4caf50; font-weight: 700; }
  .dot-no { color: #888; }
  .dot-partial { color: var(--accent); }

  /* BLOCK HEADER */
  .block-header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .block-icon { font-size: 20px; }
  .block-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .block-count { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* HOME / PORTADA */
  .home-hero { text-align: center; padding: 40px 0 32px; }
  .home-hero h1 { font-size: 28px; font-weight: 800; color: var(--text); margin: 0 0 8px; }
  .home-hero p { font-size: 15px; color: var(--muted); max-width: 560px; margin: 0 auto 28px; line-height: 1.6; }
  .home-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-bottom: 40px; }
  .home-stat { text-align: center; }
  .home-stat .num { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; }
  .home-stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .home-group-title { font-size: 11px; font-weight: 700; color: var(--muted); margin: 28px 0 10px; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 4px; }
  .home-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; flex-direction: column; gap: 3px; }
  .home-card:hover { border-color: var(--accent-dim); background: #1a1a1a; }
  .home-card .hc-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .home-card .hc-steps { font-size: 11px; color: var(--muted); }
  .home-card-pending { opacity: .45; cursor: default; }
  .home-card-pending:hover { border-color: var(--border); background: var(--surface); }
  .home-footer { margin-top: 40px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .home-footer a { color: var(--accent); text-decoration: none; }
  .home-footer a:hover { text-decoration: underline; }

  /* LIGHTBOX */
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
    z-index: 500; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 8px; border: 1px solid var(--accent); }
  #lightbox-caption { color: #ccc; font-size: 13px; }
  #lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 28px; color: #fff; cursor: pointer; line-height: 1; }

  /* PLACEHOLDER (while no screenshot) */
  .img-placeholder {
    width: 100%; max-width: 420px; height: 220px;
    background: #111; border: 2px dashed var(--border);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: #444; font-size: 12px;
    flex-shrink: 0;
  }
  .img-placeholder .ph-icon { font-size: 28px; }

  /* MOBILE */
  @media (max-width: 767px) {
    #hamburger { display: flex; align-items: center; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    body { overflow: auto; }
    #main { width: 100%; }
    #content { padding: 16px; }
    #topbar { padding: 8px 12px; gap: 8px; }
    .step-body { flex-direction: column; }
    .step-img-wrap { max-width: 100% !important; width: 100%; }
    .step-img-wrap img { width: 100%; }
    .hero { padding: 20px; }
    .hero h1 { font-size: 20px; }
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════
// LANG
// ═══════════════════════════════════════════════════════════════
let LANG = 'es';
const t = (es, en) => LANG === 'es' ? es : en;

// ═══════════════════════════════════════════════════════════════
// DATA -Secciones y pasos
// ═══════════════════════════════════════════════════════════════
const SECTIONS = [

  // ─────────────────────────────────────────────────────────────
  // 00 -INTRODUCCI“N
  // ─────────────────────────────────────────────────────────────
  {
    id: 'intro-01', group: 'intro',
    es: '01 - ¿Qué es la Passphrase?', en: '01 - What is a Passphrase?',
    steps: [
      {
        noImg: true,
        es: '¿Qué es la Passphrase BIP39?',
        en: 'What is the BIP39 Passphrase?',
        des: `La Passphrase es una <strong>capa adicional opcional del estándar BIP39</strong>.<br><br>
        Una función incluida dentro del estándar BIP39 que permite activar una palabra, frase y/o combinación de caracteres a tu semilla de recuperación (comúnmente de 12/24 palabras).<br><br>
        A veces conocida como: <strong>palabra 13/25</strong>, Frase de Contraseña, BIP39 Passphrase, Seed Extension.<br><br>
        Por defecto, todas las billeteras BIP39 usan una Passphrase vacía (sin nada). Esto implica que, aunque no la veas ni la configures, siempre forma parte del proceso de creación de tus claves.<br><br>
        Puede ser cualquier cadena de caracteres, no necesariamente una sola palabra.<br><br>
        Al definir una Passphrase, la misma semilla crea una billetera completamente diferente e independiente.<br><br>
        <strong>Combinar tu semilla + tu Passphrase determina a qué billetera se deriva y a qué fondos tendrás acceso.</strong><br><br>
        <div class="tip">
        <strong>Ejemplo concreto:</strong><br>
        Seed (12/24 palabras) + sin passphrase = Billetera A<br>
        Seed (12/24 palabras) + passphrase <code>bitcoin</code> = Billetera B<br>
        Seed (12/24 palabras) + passphrase <code>Bitcoin</code> = Billetera C<br><br>
        Son tres billeteras completamente distintas. No es la misma billetera con una contraseña — son direcciones y claves diferentes.
        </div><br>
        <strong>No existe una passphrase "incorrecta"</strong><br>
        Cualquier cadena de caracteres que tipees, inclusive sin datos, produce una billetera válida con sus propias direcciones. Tu dispositivo nunca te alerta que cometiste un error de tipeo.<br><br>
        <strong>Almacenamiento temporal</strong><br>
        A diferencia de tu seed, la passphrase no queda respaldada en el dispositivo ni en ningún software. Por lo general se debe tipear manualmente en cada sesión.<br><br>
        <div class="warn">
        <strong>Advertencia:</strong> esta opción solo debe usarla quien comprenda completamente sus implicaciones. Un error de tipeo y/o una passphrase olvidada puede resultar en pérdida permanente e irrecuperable de fondos.
        </div>`,
        den: `The Passphrase is an <strong>optional additional layer of the BIP39 standard</strong>.<br><br>
        A function included within the BIP39 standard that allows activating a word, phrase and/or combination of characters to your recovery seed (commonly 12/24 words).<br><br>
        Sometimes known as: <strong>word 13/25</strong>, Passphrase, BIP39 Passphrase, Seed Extension.<br><br>
        By default, all BIP39 wallets use an empty Passphrase (nothing). This means that, even if you don't see it or configure it, it is always part of the key creation process.<br><br>
        It can be any string of characters, not necessarily a single word.<br><br>
        By defining a Passphrase, the same seed creates a completely different and independent wallet.<br><br>
        <strong>Combining your seed + your Passphrase determines which wallet is derived and which funds you will have access to.</strong><br><br>
        <div class="tip">
        <strong>Concrete example:</strong><br>
        Seed (12/24 words) + no passphrase = Wallet A<br>
        Seed (12/24 words) + passphrase <code>bitcoin</code> = Wallet B<br>
        Seed (12/24 words) + passphrase <code>Bitcoin</code> = Wallet C<br><br>
        These are three completely different wallets. It is not the same wallet with a password — they have different addresses and keys.
        </div><br>
        <strong>There is no "incorrect" passphrase</strong><br>
        Any string of characters you type, including nothing, produces a valid wallet with its own addresses. Your device never alerts you that you made a typo.<br><br>
        <strong>Temporary storage</strong><br>
        Unlike your seed, the passphrase is not backed up on the device or in any software. It generally must be typed manually each session.<br><br>
        <div class="warn">
        <strong>Warning:</strong> this option should only be used by those who fully understand its implications. A typo and/or a forgotten passphrase can result in permanent and unrecoverable loss of funds.
        </div>`
      },
    ]
  },

  {
    id: 'intro-02', group: 'intro',
    es: '02 - ¿Para Qué Sirve?', en: '02 - What is it For?',
    steps: [
      {
        noImg: true,
        es: '¿Para Qué Sirve la Passphrase?',
        en: 'What is the Passphrase For?',
        des: `<strong>1. Protección si te roban o exponen la semilla</strong><br>
        Si alguien encuentra tus 12 o 24 palabras, sin la passphrase solo accede a tu billetera base —que puede estar vacía o tener un saldo señuelo. Tus fondos reales permanecen inaccesibles sin la passphrase correcta.<br><br>
        <strong>2. Negación plausible (plausible deniability)</strong><br>
        Podés mantener una billetera con poco saldo sin passphrase (o con una passphrase simple conocida) como señuelo bajo coerción, mientras tu billetera principal está protegida por una passphrase fuerte y secreta.<br><br>
        <strong>3. Múltiples billeteras desde una misma semilla</strong><br>
        Usando passphrases diferentes podés derivar billeteras separadas para distintos propósitos —todo desde el mismo dispositivo físico y la misma seed.<br><br>
        <strong>4. Protección anti-extracción física</strong><br>
        Si alguien comprometiera físicamente tu hardware wallet, no podría extraer la passphrase —porque simplemente no está almacenada en el dispositivo.<br><br>
        <div class="info">
        La passphrase no reemplaza tu semilla: la complementa. Necesitás <strong>ambas</strong> para acceder a tu billetera protegida.
        </div>`,
        den: `<strong>1. Protection if your seed is stolen or exposed</strong><br>
        If someone finds your 12 or 24 words, without the passphrase they can only access your base wallet —which can be empty or hold a decoy balance. Your real funds remain inaccessible without the correct passphrase.<br><br>
        <strong>2. Plausible deniability</strong><br>
        You can maintain a wallet with a small balance without a passphrase (or with a simple known one) as a decoy under coercion, while your main wallet is protected by a strong, secret passphrase.<br><br>
        <strong>3. Multiple wallets from the same seed</strong><br>
        Using different passphrases you can derive separate wallets for different purposes —all from the same physical device and the same seed.<br><br>

    label: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Desktop]</span>`,
    labelEn: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Desktop]</span>` },
  { id: 'mobile',
    label: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Mobile]</span>`,
    labelEn: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Mobile]</span>` },
  { id: 'browser',
    label: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Browser]</span>`,
    labelEn: `<span style="color:#ef5350">Hot</span><span style="color:var(--text)">-Wallets</span> <span style="color:#555">[Browser]</span>` },
  { id: 'pending',
    label: `<span style="color:#ffd600">Pendientes</span>`,
    labelEn: `<span style="color:#ffd600">Pending</span>` },
];

function buildNav() {
  const tree = document.getElementById('nav-tree');
  tree.innerHTML = '';
  GROUPS.forEach(g => {
    const secs = SECTIONS.filter(s => s.group === g.id);
    if (!secs.length) return;
    const grp = document.createElement('div');
    grp.className = 'sec-group';
    const hdr = document.createElement('div');
    hdr.className = 'sec-header';
    hdr.dataset.gid = g.id;
    const label = LANG === 'en' ? g.labelEn : g.label;
    hdr.innerHTML = `<span>${label}</span><span class="arrow">▶</span>`;
    const items = document.createElement('div');
    items.className = 'sec-items';
    secs.forEach(sec => {
      const item = document.createElement('div');
      item.className = 'sec-item' + (sec.ready ? ' ready' : '');
      item.dataset.sid = sec.id;
      item.innerHTML = `<span>${t(sec.es, sec.en)}</span>`;
      item.addEventListener('click', () => loadSection(sec.id));
      items.appendChild(item);
    });
    hdr.addEventListener('click', () => {
      const open = items.classList.toggle('open');
      hdr.classList.toggle('open', open);
    });
    grp.appendChild(hdr);
    grp.appendChild(items);
    tree.appendChild(grp);
  });
  // open first group
  const first = tree.querySelector('.sec-header');
  if (first) { first.click(); }
}

// ═══════════════════════════════════════════════════════════════
// RENDER SECTION
// ═══════════════════════════════════════════════════════════════
function loadSection(sid) {
  const sec = SECTIONS.find(s => s.id === sid);
  if (!sec) return;
  document.querySelectorAll('.sec-item').forEach(el => el.classList.toggle('active', el.dataset.sid === sid));

  const content = document.getElementById('content');
  const steps = sec.steps;
  let html = `<h2 class="sec-title">${t(sec.es, sec.en)}${sec.brand ? `<span class="brand-badge brand-${sec.brand.toLowerCase().replace(/\s+/g,'-')}">${sec.brand}</span>` : ''}</h2>`;
  html += `<div class="sec-subtitle">${steps.length} ${LANG==='es'?'paso':'step'}${steps.length!==1?'s':''}</div>`;

  steps.forEach((step, i) => {
    const title = t(step.es, step.en);
    const desc  = t(step.des || '', step.den || '');
    const imgW  = step.imgW || 420;
    const sc    = step.sc || 1;
    const w     = Math.round(imgW * sc);

    let imgHtml = '';
    if (!step.noImg) {
      if (step.f) {
        imgHtml = `<div class="step-img-wrap" style="max-width:${w}px"><img src="Prints/${step.f}" alt="${title}" onclick="openLightbox('Prints/${step.f}','${title}')"></div>`;
      } else {
        imgHtml = `<div class="img-placeholder" style="max-width:${w}px; width:100%"><div class="ph-icon">📷</div><div>Screenshot próximamente</div></div>`;
      }
    }

    html += `
    <div class="step-card">
      <div class="step-card-header">
        <span class="step-badge">${String(i+1).padStart(2,'0')}</span>
        <span class="step-title">${title}</span>
      </div>
      <div class="step-body${step.noImg?' no-img':''}">
        ${imgHtml}
        <div class="step-text">${desc}</div>
      </div>
    </div>`;
  });

  content.innerHTML = html;
  content.scrollTop = 0;
  updateProgress(sid);
}

// ═══════════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════════
function updateProgress(sid) {
  const ids = SECTIONS.map(s => s.id);
  const idx = ids.indexOf(sid);
  const pct = ids.length > 1 ? Math.round((idx / (ids.length - 1)) * 100) : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════
function buildSearchIndex() {
  const idx = [];
  SECTIONS.forEach(sec => {
    sec.steps.forEach((step, i) => {
      const label = t(step.es, step.en);
      const body  = (t(step.des || '', step.den || '')).replace(/<[^>]+>/g, ' ');
      idx.push({ sid: sec.id, sLabel: t(sec.es, sec.en), num: i+1, label, body });
    });
  });
  return idx;
}

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchIdx = null;
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!searchIdx) searchIdx = buildSearchIndex();
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  const hits = searchIdx.filter(e =>
    e.label.toLowerCase().includes(q) ||
    e.body.toLowerCase().includes(q) ||
    e.sLabel.toLowerCase().includes(q)
  ).slice(0, 8);
  if (!hits.length) { searchResults.classList.remove('open'); return; }
  searchResults.innerHTML = hits.map(h => {
    const snip = h.body.substring(h.body.toLowerCase().indexOf(q) - 20, h.body.toLowerCase().indexOf(q) + 60).trim();
    return `<div class="sr-item" data-sid="${h.sid}">
      <span class="sr-num">${String(h.num).padStart(2,'0')}</span>
      <span class="sr-label">${h.label}</span>
      <span class="sr-sec">${h.sLabel}</span>
      <span class="sr-snippet">${snip}…</span>
    </div>`;
  }).join('');
  searchResults.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => {
      loadSection(el.dataset.sid);
      searchInput.value = '';
      searchResults.classList.remove('open');
    });
  });
  searchResults.classList.add('open');
});
document.addEventListener('click', e => {
  if (!searchInput.contains(e.target) && !searchResults.contains(e.target))
    searchResults.classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// LANG TOGGLE
// ═══════════════════════════════════════════════════════════════
document.getElementById('lang-toggle').addEventListener('click', function() {
  LANG = LANG === 'es' ? 'en' : 'es';
  this.textContent = LANG === 'es' ? 'EN' : 'ES';
  searchIdx = null;
  buildNav();
  const active = document.querySelector('.sec-item.active');
  if (active) loadSection(active.dataset.sid);
  else loadSection(SECTIONS[0].id);
});

// ═══════════════════════════════════════════════════════════════
// HAMBURGER (mobile)
// ═══════════════════════════════════════════════════════════════
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// LIGHTBOX
// ═══════════════════════════════════════════════════════════════
function openLightbox(src, caption) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox'))
    document.getElementById('lightbox').classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// HOME / PORTADA
// ═══════════════════════════════════════════════════════════════
function loadHome() {
  // deactivate any selected section
  document.querySelectorAll('.sec-item').forEach(el => el.classList.remove('active'));
  // collapse all sidebar groups
  document.querySelectorAll('.sec-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.sec-header').forEach(el => el.classList.remove('open'));

  const readySecs = SECTIONS.filter(s => s.ready && s.group !== 'pending');
  const pendingSecs = SECTIONS.filter(s => s.group === 'pending' || !s.ready);

  const groupMeta = {
    intro:   { label: 'Introducción', labelEn: 'Introduction' },
    hw:      { label: 'Cold-Wallet (Hardware)', labelEn: 'Cold-Wallet (Hardware)' },
    desktop: { label: 'Hot-Wallet (Desktop)',   labelEn: 'Hot-Wallet (Desktop)' },
    mobile:  { label: 'Hot-Wallet (Mobile)',    labelEn: 'Hot-Wallet (Mobile)' },
    browser: { label: 'Hot-Wallet (Browser)',   labelEn: 'Hot-Wallet (Browser)' },
  };

  let groupsHtml = '';
  ['intro','hw','desktop','mobile','browser'].forEach(gid => {
    const secs = readySecs.filter(s => s.group === gid);
    if (!secs.length) return;
    const meta = groupMeta[gid];
    const title = LANG === 'en' ? meta.labelEn : meta.label;
    const cards = secs.map(s => {
      const name = LANG === 'en' ? s.en : s.es;
      return `<div class="home-card" onclick="loadSection('${s.id}')">
        <span class="hc-name">${name}</span>
      </div>`;
    }).join('');
    groupsHtml += `<div class="home-group-title">${title}</div><div class="home-grid">${cards}</div>`;
  });

  const heroTitle = LANG === 'en' ? '🔐 BIP39 Passphrase Tutorials' : '🔐 Tutoriales de Passphrase BIP39';
  const statWallets = LANG === 'en' ? 'Wallets' : 'Wallets';
  const statPending = LANG === 'en' ? 'Pendientes' : 'Pendientes';
  const footerText = LANG === 'en'
    ? '¿Encontraste un error o falta tu wallet? <a href="https://github.com/MatheyBTC/Tutorial-Passphrase/issues/new/choose" target="_blank">Open an issue on GitHub</a> — contributions are welcome.'
    : '¿Encontraste un error o falta tu wallet? <a href="https://github.com/MatheyBTC/Tutorial-Passphrase/issues/new/choose" target="_blank">Abrí un issue en GitHub</a> — las contribuciones son bienvenidas.';

  document.getElementById('content').innerHTML = `
    <div class="home-hero">
      <h1>${heroTitle}</h1>
      <div class="home-stats">
        <div class="home-stat"><div class="num">${readySecs.length}</div><div class="lbl">${statWallets}</div></div>
        <div class="home-stat"><div class="num">${pendingSecs.length}</div><div class="lbl">${statPending}</div></div>
      </div>
    </div>
    ${groupsHtml}
    <div class="home-footer">${footerText}</div>
  `;
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildNav();
loadHome();
</script>
