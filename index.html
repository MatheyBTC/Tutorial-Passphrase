<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passphrase (BIP39) - Tutoriales</title>
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --accent: #f7931a; --accent-dim: #c4700f; --accent-glow: rgba(247,147,26,0.15);
    --text: #f0f0f0; --muted: #888; --sidebar-w: 270px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
    transition: transform .3s ease;
  }
  #sidebar-logo {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #sidebar-logo .logo-icon { font-size: 22px; }
  #sidebar-logo .logo-text { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .5px; line-height: 1.3; }
  #sidebar-logo .logo-sub { font-size: 13px; color: var(--muted); font-weight: 400; }

  .sec-group { border-bottom: 1px solid var(--border); }
  .sec-header {
    padding: 9px 16px; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    color: var(--text); transition: color .2s; letter-spacing: 0; text-transform: none;
  }
  .sec-header:hover { color: var(--text); }
  .sec-header.active { color: var(--accent); }
  .sec-header .arrow { font-size: 9px; transition: transform .2s; }
  .sec-header.open .arrow { transform: rotate(90deg); }
  .sec-items { display: none; }
  .sec-items.open { display: block; }

  .sec-item {
    padding: 7px 16px 7px 14px; font-size: 15px;
    cursor: pointer; color: var(--muted); transition: background .1s;
    border-left: 2px solid transparent; display: flex; align-items: center; gap: 8px;
  }
  .nav-logo { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; border-radius: 3px; }
  .nav-logo-bg { background: #fff; padding: 2px; box-sizing: border-box; border-radius: 3px; }
  .sec-item.ready { color: var(--text); }
  .sec-item:hover { background: #1e1208; color: var(--text); border-left-color: var(--accent-dim); }
  .sec-item.active { color: var(--accent); border-left-color: var(--accent); background: #1a0f00; }
  .nav-new { margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: .5px; background: var(--accent); color: #000; border-radius: 3px; padding: 1px 5px; line-height: 1.6; flex-shrink: 0; }
  .sec-item .step-num { font-size: 12px; color: var(--accent); font-family: monospace; min-width: 20px; }

  /* Brand blocks (3rd level) */
  .brand-header {
    padding: 6px 16px 6px 24px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    color: #666; background: #111; border-top: 1px solid #222;
    transition: color .2s;
  }
  .brand-header:hover { color: var(--text); }
  .brand-header.active { color: var(--accent); }
  .brand-header .arrow { font-size: 9px; transition: transform .2s; }
  .brand-header.open .arrow { transform: rotate(90deg); }
  .brand-items { display: none; }
  .brand-items.open { display: block; }
  .brand-items .sec-item { padding-left: 32px; }

  /* HAMBURGER */
  #hamburger {
    display: none; background: none; border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px;
    cursor: pointer; font-size: 16px; line-height: 1;
    transition: all .2s; white-space: nowrap; flex-shrink: 0;
  }
  #hamburger:hover { border-color: var(--accent); color: var(--accent); }
  #sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 199;
  }
  #sidebar-overlay.open { display: block; }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* TOPBAR */
  #topbar {
    padding: 10px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; color: var(--accent); white-space: nowrap; font-weight: 700; }
  #search-wrap { flex: 1; min-width: 160px; position: relative; }
  #search-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--muted); }
  #search-results {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    z-index: 100; max-height: 260px; overflow-y: auto;
  }
  #search-results.open { display: block; }
  .sr-item {
    padding: 8px 12px; font-size: 12px; cursor: pointer;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline;
    border-bottom: 1px solid var(--border);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: #1a0f00; }
  .sr-num { color: var(--accent); font-family: monospace; font-size: 10px; min-width: 24px; flex-shrink: 0; }
  .sr-label { color: var(--text); flex-shrink: 0; }
  .sr-sec { color: var(--muted); font-size: 10px; }
  .sr-snippet { color: #555; font-size: 10px; font-style: italic; width: 100%; padding-left: 30px; }

  #lang-toggle {
    background: var(--border); border: none; color: var(--text);
    padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 12px;
    transition: background .2s; white-space: nowrap;
  }
  #lang-toggle:hover { background: var(--accent); color: #fff; }

  /* PROGRESS */
  #progress-bar { height: 3px; background: var(--border); }
  #progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 28px 32px; }

  h2.sec-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    margin-bottom: 6px; padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
  }
  h2.sec-title .brand-badge {
    display: inline-block; background: var(--accent); color: #000;
    font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px;
    vertical-align: middle; margin-left: 10px; letter-spacing: .5px;
  }
  h2.sec-title .brand-badge.brand-foundation {
    background: #1a0f00; color: var(--accent); border: 1px solid var(--accent-dim);
  }
  .sec-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; margin-top: 4px; }

  /* STEP CARD */
  .step-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 16px; overflow: hidden;
    transition: border-color .2s;
  }
  .step-card:hover { border-color: var(--accent-dim); }
  .step-card-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .step-badge {
    color: var(--accent); font-size: 13px; font-weight: 800;
    white-space: nowrap; flex-shrink: 0;
  }
  .step-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .step-body { padding: 14px 16px; display: flex; gap: 20px; align-items: flex-start; }
  .step-body.no-img { display: block; }
  /* col-layout: imagen apaisada → texto abajo */
  .step-body.col-layout { flex-direction: column; }
  .step-body.col-layout .step-img-wrap { max-width: 100% !important; }
  .step-body.col-layout .step-img-wrap img { width: 100%; max-height: 520px; object-fit: contain; object-position: left; }
  /* row-layout: imagen vertical (mobile) → texto a la derecha */
  .step-img-wrap { flex-shrink: 0; max-width: 100%; }
  .step-img-wrap img {
    border-radius: 6px; border: 1px solid var(--border);
    display: block; width: 100%; cursor: zoom-in;
    transition: border-color .2s;
  }
  .step-img-wrap img:hover { border-color: var(--accent); }
  .step-text { font-size: 15px; line-height: 1.65; color: #ccc; flex: 1; }
  .step-text strong { color: var(--text); }
  .step-text code {
    background: #111; border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: 12px;
    font-family: 'Cascadia Code','Consolas',monospace; color: var(--accent);
  }

  /* TIPS/WARNINGS */
  .tip {
    background: rgba(247,147,26,.08); border: 1px solid rgba(247,147,26,.3);
    border-left: 3px solid var(--accent); padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }
  .warn {
    background: rgba(220,50,50,.08); border: 1px solid rgba(220,50,50,.3);
    border-left: 3px solid #dc3232; padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }
  .info {
    background: rgba(100,180,255,.06); border: 1px solid rgba(100,180,255,.2);
    border-left: 3px solid #64b4ff; padding: 10px 14px;
    border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 12px; color: #ccc;
  }

  /* VERIFICACIÓN SIN FINGERPRINT */
  .fp-nodev { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 14px 0; font-size: 13px; }
  .fp-nodev-title { padding: 6px 14px; background: rgba(255,255,255,.04); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--border); }
  .fp-nodev-row { padding: 7px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
  .fp-nodev-row:last-child { border-bottom: none; }
  .fp-nodev-row code { font-size: 12px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .fp-nodev-row-label { font-weight: 600; flex-shrink: 0; }

  /* FINGERPRINT COMPARE */
  .fp-compare { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 14px 0; font-size: 13px; }
  .fp-row-std { padding: 8px 14px; opacity: 0.5; border-bottom: 1px solid var(--border); }
  .fp-row-pp  { padding: 8px 14px; background: rgba(74,144,226,0.10); font-weight: 600; }
  .fp-row-std code, .fp-row-pp code { font-size: 12px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .fp-row-pp code { background: rgba(74,144,226,0.18); }
  .fp-here { color: #64b4ff; font-size: 11px; margin-left: 6px; }

  /* INTRO/HERO */
  .hero {
    background: linear-gradient(135deg, #1a0f00 0%, #1a1a1a 100%);
    border: 1px solid var(--accent-dim); border-radius: 12px;
    padding: 28px 32px; margin-bottom: 24px;
  }
  .hero h1 { font-size: 26px; color: var(--accent); margin-bottom: 8px; }
  .hero p { font-size: 14px; color: #bbb; line-height: 1.7; }
  .hero .tagline { font-size: 13px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }

  /* CONCEPT CARDS */
  .concept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .concept-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .concept-card .icon { font-size: 24px; margin-bottom: 8px; }
  .concept-card h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .concept-card p { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* DEVICE INDEX TABLE */
  .device-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
  .device-table th { background: #111; color: var(--accent); text-align: left; padding: 8px 12px; border: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .device-table td { padding: 8px 12px; border: 1px solid var(--border); color: #ccc; }
  .device-table tr:hover td { background: #1a0f00; }
  .badge-hw { background: #1a0f00; color: var(--accent); border: 1px solid var(--accent-dim); padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-sw { background: #0f1a2a; color: #64b4ff; border: 1px solid #2a4a6a; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-mobile { background: #0f1a0f; color: #4caf50; border: 1px solid #2a4a2a; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .dot-yes { color: #4caf50; font-weight: 700; }
  .dot-no { color: #888; }
  .dot-partial { color: var(--accent); }

  /* BLOCK HEADER */
  .block-header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .block-icon { font-size: 20px; }
  .block-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .block-count { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* HOME/PORTADA */
  .home-hero { text-align: center; padding: 12px 0 4px; }
  .home-hero h1 { font-size: 28px; font-weight: 800; color: var(--text); margin: 0 0 4px; }
  .home-hero p { font-size: 15px; color: var(--muted); max-width: 560px; margin: 0 auto 14px; line-height: 1.6; }
  .home-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-bottom: 10px; }
  .home-stat { text-align: center; }
  .home-stat .num { font-size: 32px; font-weight: 800; line-height: 1; }
  .home-stat .num-orange { color: #f7931a; }
  .home-stat .num-yellow { color: #eab308; }
  .home-stat .lbl { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .home-group-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 0 5px; }
  .hgt-count { color: var(--accent); font-size: 13px; font-weight: 700; margin-left: 4px; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 4px; }
  .home-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; flex-direction: row; align-items: center; gap: 10px; }
  .home-card:hover { border-color: var(--accent-dim); background: #1a1a1a; }
  .home-card .hc-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .home-card .hc-steps { font-size: 11px; color: var(--muted); }
  .hc-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
  .hc-logo-ios { border-radius: 22%; }
  .hc-logo-bg { background: #fff; border-radius: 4px; padding: 3px; box-sizing: border-box; }
  .hc-logo-placeholder { width: 28px; height: 28px; flex-shrink: 0; }
  .home-card-pending { opacity: .45; cursor: default; }
  .home-card-pending:hover { border-color: var(--border); background: var(--surface); }
  #content.home-active { padding: 16px 23px; }
  .home-footer { margin-top: 40px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-align: center; font-size: 15px; color: var(--muted); line-height: 1.6; }
  .home-footer a { color: var(--accent); text-decoration: none; }
  .home-footer a:hover { text-decoration: underline; }

  /* ENTROPY */
  .entr-level { border-radius: 10px; padding: 13px 16px; margin-bottom: 10px; }
  .entr-l1 { background: rgba(34,197,94,.11); border: 1px solid rgba(34,197,94,.32); }
  .entr-l2 { background: rgba(34,197,94,.06); border: 1px solid rgba(34,197,94,.18); }
  .entr-l3 { background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.28); }
  .entr-l4 { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.28); }
  .entr-no { background: rgba(90,90,90,.1); border: 1px solid rgba(90,90,90,.22); }
  .entr-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin-bottom: 7px; letter-spacing: .3px; }
  .entr-b1 { background: rgba(34,197,94,.18); color: #4ade80; }
  .entr-b2 { background: rgba(34,197,94,.11); color: #86efac; }
  .entr-b3 { background: rgba(234,179,8,.18); color: #fbbf24; }
  .entr-b4 { background: rgba(239,68,68,.18); color: #f87171; }
  .entr-bno { background: rgba(90,90,90,.18); color: #999; }
  .entr-level-title { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 8px; }
  .entr-item { font-size: 14px; color: var(--muted); margin-bottom: 5px; padding-left: 4px; line-height: 1.5; }
  .entr-item strong { color: var(--text); }
  .entr-math { background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 13px 18px; font-family: monospace; font-size: 13px; margin: 12px 0; line-height: 2; color: #c9d1d9; }
  .entr-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
  .entr-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .4px; text-transform: uppercase; }
  .entr-table td { padding: 9px 10px; border-bottom: 1px solid #1e1e1e; vertical-align: top; line-height: 1.5; }
  .entr-table tr:last-child td { border-bottom: none; }
  .entr-table td:first-child { font-weight: 600; color: var(--text); white-space: nowrap; }

  /* LIGHTBOX */
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
    z-index: 500; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 8px; border: 1px solid var(--accent); }
  #lightbox-caption { color: #ccc; font-size: 13px; }
  #lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 28px; color: #fff; cursor: pointer; line-height: 1; }

  /* PLACEHOLDER (while no screenshot) */
  .img-placeholder {
    width: 100%; max-width: 420px; height: 220px;
    background: #111; border: 2px dashed var(--border);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; color: #444; font-size: 12px;
    flex-shrink: 0;
  }
  .img-placeholder .ph-icon { font-size: 28px; }

  /* MOBILE */
  @media (max-width: 767px) {
    #hamburger { display: flex; align-items: center; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    body { overflow: auto; }
    #main { width: 100%; }
    #content { padding: 16px; }
    #topbar { padding: 8px 12px; gap: 8px; }
    .step-body { flex-direction: column; }
    .step-img-wrap { max-width: 100% !important; width: 100%; }
    .step-img-wrap img { width: 100%; }
    .hero { padding: 20px; }
    .hero h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="sidebar-logo" onclick="loadHome()" style="cursor:pointer">
    <div class="logo-icon">🔐</div>
    <div>
      <div class="logo-text">Passphrase (BIP39)</div>
      <div class="logo-sub">Tutoriales</div>
    </div>
  </div>

  <div id="nav-tree"></div>
</div>
<div id="sidebar-overlay"></div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <button id="hamburger">☰</button>
    <h1>🔐 Passphrase (BIP39) - Tutoriales</h1>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Buscar paso, wallet, marca...">
      <div id="search-results"></div>
    </div>
    <button id="lang-toggle">EN</button>
  </div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="content"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-caption"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// LANG
// ═══════════════════════════════════════════════════════════════
let LANG = 'es';
const t = (es, en) => LANG === 'es' ? es : en;

// ═══════════════════════════════════════════════════════════════
// DATA -Secciones y pasos
// ═══════════════════════════════════════════════════════════════
const SECTIONS = [

  // ─────────────────────────────────────────────────────────────
  // 00 -INTRODUCCI“N
  // ─────────────────────────────────────────────────────────────
  {
    id: 'intro-01', group: 'intro',
    es: '01 - ¿Qué es la Passphrase?', en: '01 - What is a Passphrase?',
    steps: [
      {
        noImg: true,
        es: '¿Qué es la Passphrase BIP39?',
        en: 'What is the BIP39 Passphrase?',
        des: `La Passphrase es una <strong>capa adicional opcional del estándar BIP39</strong>.<br><br>
        Una función incluida dentro del estándar BIP39 que permite activar una palabra, frase y/o combinación de caracteres a tu semilla de recuperación (comúnmente de 12/24 palabras).<br><br>

function buildNav() {
  const tree = document.getElementById('nav-tree');
  tree.innerHTML = '';
  GROUPS.forEach(g => {
    const secs = SECTIONS.filter(s => s.group === g.id);
    if (!secs.length) return;
    const grp = document.createElement('div');
    grp.className = 'sec-group';
    const hdr = document.createElement('div');
    hdr.className = 'sec-header';
    hdr.dataset.gid = g.id;
    const label = LANG === 'en' ? g.labelEn : g.label;
    hdr.innerHTML = `<span>${label}</span><span class="arrow">▶</span>`;
    const items = document.createElement('div');
    items.className = 'sec-items';
    secs.forEach(sec => {
      const item = document.createElement('div');
      item.className = 'sec-item' + (sec.ready ? ' ready' : '');
      item.dataset.sid = sec.id;
      const navLogo = sec.logo
        ? `<img class="nav-logo${sec.logoBg ? ' nav-logo-bg' : ''}" src="Prints/logos/${sec.logo}" alt="">`
        : '';
      const isStillNew = sec.addedOn
        ? (Date.now() - new Date(sec.addedOn).getTime()) < 7 * 24 * 60 * 60 * 1000
        : false;
      const newBadge = isStillNew ? `<span class="nav-new">NEW</span>` : '';
      item.innerHTML = `${navLogo}<span>${t(sec.es, sec.en)}</span>${newBadge}`;
      item.addEventListener('click', () => loadSection(sec.id));
      items.appendChild(item);
    });
    hdr.addEventListener('click', () => {
      const open = items.classList.toggle('open');
      hdr.classList.toggle('open', open);
    });
    grp.appendChild(hdr);
    grp.appendChild(items);
    tree.appendChild(grp);
  });
  // open first group
  const first = tree.querySelector('.sec-header');
  if (first) { first.click(); }
}

// ═══════════════════════════════════════════════════════════════
// URL ROUTING
// ═══════════════════════════════════════════════════════════════
const BASE_PATH = '/Tutorial-Passphrase';
const SLUGS = {
  'intro-06':          'Entropia',
  'hw-jade':           'Jade',
  'hw-jade-plus':      'Jade-Plus',
  'hw-coldcard-mk4':   'Coldcard-Mk4',
  'hw-coldcard-mk5':   'Coldcard-Mk5',
  'hw-coldcard-q':     'Coldcard-Q',
  'hw-bitbox':         'BitBox02',
  'hw-bitbox-nova':    'BitBox02-Nova',
  'hw-ledger-nanox':   'Ledger-Nano-X',
  'hw-trezor-one':     'Trezor-One',
  'hw-trezor-t':       'Trezor-T',
  'hw-trezor-safe3':   'Trezor-Safe-3',
  'hw-trezor-safe5':   'Trezor-Safe-5',
  'hw-trezor-safe7':   'Trezor-Safe-7',
  'hw-krux':           'Krux',
  'hw-seedsigner':     'SeedSigner',
  'hw-passport-core':  'Passport',
  'mob-blue':          'BlueWallet',
  'mob-bull':          'Bull-Bitcoin',
  'mob-unstoppable':   'Unstoppable-Wallet',
  'mob-coinomi':       'Coinomi',
  'sw-sparrow':        'Sparrow',
  'sw-wasabi':         'Wasabi',
  'desk-rabby':        'Rabby-Wallet',
  'sw-ashigaru':       'Ashigaru',
  'sw-electrum':       'Electrum',
  'mob-nunchuk':       'Nunchuk',
  'mob-cake':          'Cake-Wallet',
  'hw-passport-prime': 'Passport-Prime',
  'hw-safepal':        'SafePal-S1',
  'mob-safepal':       'SafePal-App',
};
const SLUG_TO_ID = Object.fromEntries(
  Object.entries(SLUGS).map(([k, v]) => [v.toLowerCase(), k])
);

function slugFromPath() {
  const p = window.location.pathname.replace(BASE_PATH, '').replace(/^\//, '').replace(/\/$/, '');
  return p || null;
}

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.sid) loadSection(e.state.sid, false);
  else loadHome(false);
});

// ═══════════════════════════════════════════════════════════════
// RENDER SECTION
// ═══════════════════════════════════════════════════════════════
function loadSection(sid, pushUrl) {
  if (pushUrl === undefined) pushUrl = true;
  const sec = SECTIONS.find(s => s.id === sid);
  if (!sec) return;
  if (pushUrl && SLUGS[sid]) {
    history.pushState({ sid }, '', BASE_PATH + '/' + SLUGS[sid]);
  }
  document.getElementById('content').classList.remove('home-active');
  document.querySelectorAll('.sec-item').forEach(el => el.classList.toggle('active', el.dataset.sid === sid));

  const content = document.getElementById('content');
  const steps = sec.steps;
  let html = `<h2 class="sec-title">${t(sec.es, sec.en)}${sec.brand ? `<span class="brand-badge brand-${sec.brand.toLowerCase().replace(/\s+/g,'-')}">${sec.brand}</span>` : ''}</h2>`;
  html += `<div class="sec-subtitle">${steps.length} ${LANG==='es'?'paso':'step'}${steps.length!==1?'s':''}</div>`;

  steps.forEach((step, i) => {
    const title = t(step.es, step.en);
    const desc  = t(step.des || '', step.den || '');
    const imgW  = step.imgW || 420;
    const sc    = step.sc || 1;
    const w     = Math.round(imgW * sc);

    let imgHtml = '';
    if (!step.noImg) {
      if (step.f) {
        imgHtml = `<div class="step-img-wrap" style="max-width:${w}px"><img src="Prints/${step.f}" alt="${title}" onclick="openLightbox('Prints/${step.f}','${title}')"></div>`;
      } else {
        imgHtml = `<div class="img-placeholder" style="max-width:${w}px; width:100%"><div class="ph-icon">📷</div><div>Screenshot próximamente</div></div>`;
      }
    }

    html += `
    <div class="step-card">
      <div class="step-card-header">
        <span class="step-badge">${String(i+1).padStart(2,'0')}</span>
        <span class="step-title">${title}</span>
      </div>
      <div class="step-body${step.noImg?' no-img':''}${step.colLayout?' col-layout':''}">
        ${imgHtml}
        <div class="step-text">${desc}</div>
      </div>
    </div>`;
  });

  content.innerHTML = html;
  content.scrollTop = 0;

  // Auto col-layout: imagen apaisada (landscape) → texto abajo; vertical (portrait) → texto a la derecha
  content.querySelectorAll('.step-body:not(.no-img)').forEach(body => {
    const img = body.querySelector('.step-img-wrap img');
    if (!img) return;
    const applyLayout = () => {
      if (img.naturalWidth > 0 && img.naturalHeight > 0) {
        if (img.naturalWidth > img.naturalHeight) {
          body.classList.add('col-layout');
        }
      }
    };
    if (img.complete && img.naturalWidth > 0) {
      applyLayout();
    } else {
      img.addEventListener('load', applyLayout, { once: true });
    }
  });

  updateProgress(sid);
}

// ═══════════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════════
function updateProgress(sid) {
  const ids = SECTIONS.map(s => s.id);
  const idx = ids.indexOf(sid);
  const pct = ids.length > 1 ? Math.round((idx/(ids.length - 1)) * 100) : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════
function buildSearchIndex() {
  const idx = [];
  SECTIONS.forEach(sec => {
    sec.steps.forEach((step, i) => {
      const label = t(step.es, step.en);
      const body  = (t(step.des || '', step.den || '')).replace(/<[^>]+>/g, ' ');
      idx.push({ sid: sec.id, sLabel: t(sec.es, sec.en), num: i+1, label, body });
    });
  });
  return idx;
}

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchIdx = null;
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!searchIdx) searchIdx = buildSearchIndex();
  if (q.length < 2) { searchResults.classList.remove('open'); return; }
  const hits = searchIdx.filter(e =>
    e.label.toLowerCase().includes(q) ||
    e.body.toLowerCase().includes(q) ||
    e.sLabel.toLowerCase().includes(q)
  ).slice(0, 8);
  if (!hits.length) { searchResults.classList.remove('open'); return; }
  searchResults.innerHTML = hits.map(h => {
    const snip = h.body.substring(h.body.toLowerCase().indexOf(q) - 20, h.body.toLowerCase().indexOf(q) + 60).trim();
    return `<div class="sr-item" data-sid="${h.sid}">
      <span class="sr-num">${String(h.num).padStart(2,'0')}</span>
      <span class="sr-label">${h.label}</span>
      <span class="sr-sec">${h.sLabel}</span>
      <span class="sr-snippet">${snip}…</span>
    </div>`;
  }).join('');
  searchResults.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => {
      loadSection(el.dataset.sid);
      searchInput.value = '';
      searchResults.classList.remove('open');
    });
  });
  searchResults.classList.add('open');
});
document.addEventListener('click', e => {
  if (!searchInput.contains(e.target) && !searchResults.contains(e.target))
    searchResults.classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// LANG TOGGLE
// ═══════════════════════════════════════════════════════════════
document.getElementById('lang-toggle').addEventListener('click', function() {
  LANG = LANG === 'es' ? 'en' : 'es';
  this.textContent = LANG === 'es' ? 'EN' : 'ES';
  searchIdx = null;
  buildNav();
  const active = document.querySelector('.sec-item.active');
  if (active) loadSection(active.dataset.sid);
  else loadSection(SECTIONS[0].id);
});

// ═══════════════════════════════════════════════════════════════
// HAMBURGER (mobile)
// ═══════════════════════════════════════════════════════════════
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// LIGHTBOX
// ═══════════════════════════════════════════════════════════════
function openLightbox(src, caption) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox'))
    document.getElementById('lightbox').classList.remove('open');
});

// ═══════════════════════════════════════════════════════════════
// HOME/PORTADA
// ═══════════════════════════════════════════════════════════════
function loadHome(pushUrl) {
  if (pushUrl === undefined) pushUrl = true;
  if (pushUrl) history.pushState({ home: true }, '', BASE_PATH + '/');
  // deactivate any selected section
  document.querySelectorAll('.sec-item').forEach(el => el.classList.remove('active'));
  // collapse all sidebar groups
  document.querySelectorAll('.sec-items').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.sec-header').forEach(el => el.classList.remove('open'));

  const readySecs = SECTIONS.filter(s => s.ready && s.group !== 'pending');
  const pendingSecs = SECTIONS.filter(s => s.group === 'pending' || !s.ready);

  const groupMeta = {
    intro:   { label: 'Introducción', labelEn: 'Introduction' },
    hw:      { label: 'Cold-Wallet (Hardware)', labelEn: 'Cold-Wallet (Hardware)' },
    desktop: { label: 'Hot-Wallet (Desktop)',   labelEn: 'Hot-Wallet (Desktop)' },
    mobile:  { label: 'Hot-Wallet (Mobile)',    labelEn: 'Hot-Wallet (Mobile)' },
    browser: { label: 'Hot-Wallet (Browser)',   labelEn: 'Hot-Wallet (Browser)' },
  };

  let groupsHtml = '';
  ['hw','desktop','mobile','browser'].forEach(gid => {
    const secs = readySecs.filter(s => s.group === gid);
    if (!secs.length) return;
    const meta = groupMeta[gid];
    const title = LANG === 'en' ? meta.labelEn : meta.label;
    const isMobile = gid === 'mobile' || gid === 'browser' || gid === 'desktop';
    const cards = secs.map(s => {
      const name = LANG === 'en' ? s.en : s.es;
      const logoHtml = s.logo
        ? `<img class="hc-logo${isMobile ? ' hc-logo-ios' : ''}${s.logoBg ? ' hc-logo-bg' : ''}" src="Prints/logos/${s.logo}" alt="">`
        : `<span class="hc-logo-placeholder"></span>`;
      return `<div class="home-card" onclick="loadSection('${s.id}')">
        ${logoHtml}
        <span class="hc-name">${name}</span>
      </div>`;
    }).join('');
    groupsHtml += `<div class="home-group-title">${title} <span class="hgt-count">${secs.length}</span></div><div class="home-grid">${cards}</div>`;
  });

  const heroTitle = LANG === 'en' ? '🔐 BIP39 Passphrase Tutorials' : '🔐 Tutoriales de Passphrase BIP39';
  const statWallets = 'Wallets';
  const statPending = LANG === 'en' ? 'Pending' : 'Pendientes';
  const footerText = LANG === 'en'
    ? `Found an error or missing wallet? You can <a href="https://github.com/MatheyBTC/Tutorial-Passphrase/issues/new/choose" target="_blank">open an issue on GitHub</a> (contributions are welcome).<br>🌐 Available EN/ES (use the toggle above)<br><br>⚡ Found this useful? <a href="lightning:MatheyBTC@getalby.com">MatheyBTC@getalby.com</a>`
    : `¿Encontraste un error o falta tu wallet? Puedes <a href="https://github.com/MatheyBTC/Tutorial-Passphrase/issues/new/choose" target="_blank">abrir un issue en GitHub</a> (las contribuciones son bienvenidas).<br>🌐 Disponible EN/ES (usar el toggle arriba)<br><br>⚡ ¿Te fue útil? <a href="lightning:MatheyBTC@getalby.com">MatheyBTC@getalby.com</a>`;

  const content = document.getElementById('content');
  content.classList.add('home-active');
  content.innerHTML = `
    <div class="home-hero">
      <h1>${heroTitle}</h1>
    </div>
    ${groupsHtml}
    <div class="home-footer">${footerText}</div>
  `;
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildNav();

// Check if arriving via 404 redirect (sessionStorage) or direct URL slug
(function() {
  // 404.html stores the slug in sessionStorage before redirecting
  const ssSlug = sessionStorage.getItem('ss_redirect');
  if (ssSlug) {
    sessionStorage.removeItem('ss_redirect');
    const sid = SLUG_TO_ID[ssSlug.toLowerCase()];
    if (sid) { history.replaceState({ sid }, '', BASE_PATH + '/' + ssSlug); loadSection(sid, false); return; }
  }
  // Direct load with slug in path (e.g. navigating locally or after replaceState)
  const slug = slugFromPath();
  if (slug) {
    const sid = SLUG_TO_ID[slug.toLowerCase()];
    if (sid) { loadSection(sid, false); return; }
  }
  loadHome(false);
}());
</script>
